worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream definitions — one per WildFly microservice ──
    # NOTE: these use the docker-compose *service names* and each
    # service's *container-internal* port (8080, since every
    # WildFly container listens on -b 0.0.0.0 inside the network).
    # The 908x ports in docker-compose.yml are host-side mappings
    # only and are not reachable as 127.0.0.1 from another container.
    upstream user_service {
        server wf-user-service:8080;
    }
    upstream catalog_service {
        server wf-catalog-service:8080;
    }
    upstream inventory_service {
        server wf-inventory-service:8080;
    }
    upstream order_capture_service {
        server wf-order-capture-service:8080;
    }
    upstream order_fulfillment_service {
        server wf-order-fulfillment-service:8080;
    }
    upstream cart_service {
        server wf-cart-service:8080;
    }

    server {

        listen 9080;
        server_name localhost;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # User Service
        location /api/users/ {
            rewrite ^/api/users/(.*)$ /user-service/users/$1 break;
            proxy_pass http://user_service;
        }

        location = /api/users {
            rewrite ^ /user-service/users break;
            proxy_pass http://user_service;
        }

        # Catalog Service - Categories
        location /api/categories/ {
            rewrite ^/api/categories/(.*)$ /catalog-service/categories/$1 break;
            proxy_pass http://catalog_service;
        }

        location = /api/categories {
            rewrite ^ /catalog-service/categories break;
            proxy_pass http://catalog_service;
        }

        # Catalog Service - Products
        location /api/products/ {
            rewrite ^/api/products/(.*)$ /catalog-service/products/$1 break;
            proxy_pass http://catalog_service;
        }

        location = /api/products {
            rewrite ^ /catalog-service/products break;
            proxy_pass http://catalog_service;
        }

        # Catalog Service - Items
        location /api/items/ {
            rewrite ^/api/items/(.*)$ /catalog-service/items/$1 break;
            proxy_pass http://catalog_service;
        }

        location = /api/items {
            rewrite ^ /catalog-service/items break;
            proxy_pass http://catalog_service;
        }

        # Inventory Service
        location /api/inventory/ {
            rewrite ^/api/inventory/(.*)$ /inventory-service/inventory/$1 break;
            proxy_pass http://inventory_service;
        }

        location = /api/inventory {
            rewrite ^ /inventory-service/inventory break;
            proxy_pass http://inventory_service;
        }

        # Order Capture Service
        location /api/orders/ {
            rewrite ^/api/orders/(.*)$ /order-capture-service/orders/$1 break;
            proxy_pass http://order_capture_service;
        }

        location = /api/orders {
            rewrite ^ /order-capture-service/orders break;
            proxy_pass http://order_capture_service;
        }

        # Order Fulfilment Service
        # NOTE: the deployed WAR context root is "order-fulfillment-service"
        # and OrderFulfillmentController is @Path("/fulfillment") (singular) —
        # the old config rewrote to ".../fulfilments" (plural) and 404'd.
        location /api/fulfilments/ {
            rewrite ^/api/fulfilments/(.*)$ /order-fulfillment-service/fulfillment/$1 break;
            proxy_pass http://order_fulfillment_service;
        }

        location = /api/fulfilments {
            rewrite ^ /order-fulfillment-service/fulfillment break;
            proxy_pass http://order_fulfillment_service;
        }

        # Cart Service
        location /api/cart/ {
            rewrite ^/api/cart/(.*)$ /cart-service/cart/$1 break;
            proxy_pass http://cart_service;
        }

        location = /api/cart {
            rewrite ^ /cart-service/cart break;
            proxy_pass http://cart_service;
        }

        # Gateway health check
        location = /health {
            default_type text/plain;
            return 200 "api-gateway running";
        }
    }
}
