# MicroProfile Config -- order-capture-service
app.name=order-capture-service
app.version=1.0.0-SNAPSHOT
db.url=${DB_URL:jdbc:postgresql://localhost:5444/ordercapturedb}
db.user=${DB_USER:showdown}
db.password=${DB_PASSWORD:showdown123}
inventory-service/mp-rest/url=http://wf-inventory-service:8080/inventory-service
user-service/mp-rest/url=http://wf-user-service:8080/user-service

##########################################
# Propagate the caller's JWT onto outgoing
# service-to-service calls. Without this,
# inventory-service (which is @RolesAllowed
# on every endpoint) rejects these internal
# calls as unauthenticated (403).
##########################################
Client.InventoryClient/mp-rest/propagateHeaders=Authorization
Client.UserClient/mp-rest/propagateHeaders=Authorization

##########################################
# MicroProfile JWT / Keycloak
##########################################

mp.jwt.verify.issuer=http://keycloak:8080/realms/jpetstore
mp.jwt.verify.publickey.location=http://keycloak:8080/realms/jpetstore/protocol/openid-connect/certs

smallrye.jwt.path.groups=realm_access/roles