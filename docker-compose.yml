
# Profiles:  spring | wildfly | observability

networks:
  showdown-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  otel-agent-vol:

services:

  # ── Observability ──────────────────────────────────────────────

  # Initialises the shared OTel agent volume by copying the JAR into it.
  otel-agent-init:
    build:
      context: ./observability/otel-agent
      dockerfile: Dockerfile
    image: otel-agent-image
    container_name: otel-agent-init
    profiles: [observability, spring, wildfly]
    volumes:
      - otel-agent-vol:/otel-agent
    # Uses alpine so that the sh entrypoint is available (scratch has no shell)
    entrypoint: ["/bin/sh", "-c", "cp /opentelemetry-javaagent.jar /otel-agent/opentelemetry-javaagent.jar && echo 'OTel agent ready'"]
    restart: "no"
    networks: [showdown-net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: otel-collector
    profiles: [observability]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
    depends_on: [jaeger]
    networks: [showdown-net]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"  # gRPC from otel-collector
    networks: [showdown-net]

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    profiles: [observability]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [showdown-net]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks: [showdown-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    profiles: [observability]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8090:8080"
    networks: [showdown-net]

  # ── Keycloak Identity Provider ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    profiles: [spring, wildfly]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8180:8080"
    networks: [showdown-net]

  # ── Spring Boot Databases ──────────────────────────────────────
  sb-user-db:
    image: postgres:16-alpine
    container_name: sb-user-db
    profiles: [spring]
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5431:5432"
    networks: [showdown-net]

  sb-catalog-db:
    image: postgres:16-alpine
    container_name: sb-catalog-db
    profiles: [spring]
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    networks: [showdown-net]

  sb-inventory-db:
    image: postgres:16-alpine
    container_name: sb-inventory-db
    profiles: [spring]
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    networks: [showdown-net]

  sb-order-capture-db:
    image: postgres:16-alpine
    container_name: sb-order-capture-db
    profiles: [spring]
    environment:
      POSTGRES_DB: ordercapturedb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    networks: [showdown-net]

  sb-order-fulfilment-db:
    image: postgres:16-alpine
    container_name: sb-order-fulfilment-db
    profiles: [spring]
    environment:

      POSTGRES_DB: orderfulfilmentdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5435:5432"
    networks: [showdown-net]

  sb-cart-db:
    image: redis:7-alpine
    container_name: sb-cart-db
    profiles: [spring]
    ports:
      - "6381:6379"
    networks: [showdown-net]

  sb-api-gateway:
    image: nginx:alpine
    container_name: sb-api-gateway
    profiles: [spring]
    volumes:
      - ./spring-boot/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./spring-boot/nginx/cors.conf:/etc/nginx/cors.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - sb-user-service
      - sb-catalog-service
      - sb-inventory-service
      - sb-order-capture-service
      - sb-order-fulfilment-service
      - sb-cart-service
    networks: [showdown-net]

  sb-user-service:
    build:
      context: ./spring-boot
      dockerfile: ./user-service/Dockerfile
    container_name: sb-user-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8081:8081"
    depends_on: [sb-user-db, otel-agent-init]
    networks: [showdown-net]

  sb-catalog-service:
    build:
      context: ./spring-boot
      dockerfile: ./catalog-service/Dockerfile
    container_name: sb-catalog-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-catalog-db:5432/catalogdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SERVICES_INVENTORY_URL: http://sb-inventory-service:8083
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-catalog-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8082:8082"
    depends_on: [sb-catalog-db, otel-agent-init]
    networks: [showdown-net]

  sb-inventory-service:
    build:
      context: ./spring-boot
      dockerfile: ./inventory-service/Dockerfile
    container_name: sb-inventory-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-inventory-db:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8083:8083"
    depends_on: [sb-inventory-db, otel-agent-init]
    networks: [showdown-net]

  sb-order-capture-service:
    build:
      context: ./spring-boot
      dockerfile: ./order-capture-service/Dockerfile
    container_name: sb-order-capture-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-order-capture-db:5432/ordercapturedb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SERVICES_INVENTORY_URL: http://sb-inventory-service:8083
      SERVICES_FULFILMENT_URL: http://sb-order-fulfilment-service:8085
      SERVICES_USER_URL: http://sb-user-service:8081
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-order-capture-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8084:8084"
    depends_on: [sb-order-capture-db, otel-agent-init]
    networks: [showdown-net]


  sb-order-fulfilment-service:
    build:
      context: ./spring-boot
      dockerfile: ./order-fulfilment-service/Dockerfile
    container_name: sb-order-fulfilment-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-order-fulfilment-db:5432/orderfulfilmentdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-order-fulfilment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8085:8085"

    depends_on: [sb-order-fulfilment-db, otel-agent-init]
    networks: [showdown-net]

  sb-cart-service:
    build:
      context: ./spring-boot
      dockerfile: ./cart-service/Dockerfile
    container_name: sb-cart-service
    profiles: [spring]
    environment:
      SPRING_DATA_REDIS_HOST: sb-cart-db
      KEYCLOAK_URL: http://keycloak:8080
      JAVA_TOOL_OPTIONS: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx256m"
      OTEL_SERVICE_NAME: sb-cart-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - otel-agent-vol:/otel-agent:ro
    ports:
      - "8086:8086"
    depends_on: [sb-cart-db, otel-agent-init]
    networks: [showdown-net]

  # ── WildFly Databases ─────────────────────────────────────────
  wf-user-db:
    image: postgres:16-alpine
    container_name: wf-user-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5441:5432"
    networks: [showdown-net]

  wf-catalog-db:
    image: postgres:16-alpine
    container_name: wf-catalog-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5442:5432"
    networks: [showdown-net]

  wf-inventory-db:
    image: postgres:16-alpine
    container_name: wf-inventory-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5443:5432"
    networks: [showdown-net]

  wf-order-capture-db:
    image: postgres:16-alpine
    container_name: wf-order-capture-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: ordercapturedb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5444:5432"
    networks: [showdown-net]

  wf-order-fulfillment-db:
    image: postgres:16-alpine
    container_name: wf-order-fulfillment-db
    profiles: [wildfly]
    environment:

      POSTGRES_DB: orderfulfilmentdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5445:5432"
    networks: [showdown-net]

# ── Redis Master ──────────────────────────────────────────────
  wf-cart-db-master:  
    image: redis:7-alpine
    container_name: wf-cart-db-master
    profiles: [wildfly]
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    networks: [showdown-net]

  wf-cart-db-replica-1:
    image: redis:7-alpine
    container_name: wf-cart-db-replica-1
    profiles: [wildfly]
    command: redis-server --replicaof wf-cart-db-master 6379
    depends_on: [wf-cart-db-master]
    networks: [showdown-net]

  wf-cart-db-replica-2:
    image: redis:7-alpine
    container_name: wf-cart-db-replica-2
    profiles: [wildfly]
    command: redis-server --replicaof wf-cart-db-master 6379
    depends_on: [wf-cart-db-master]
    networks: [showdown-net]

  # ── Redis Sentinels ───────────────────────────────────────────
  wf-cart-sentinel-1:
    image: redis:7-alpine
    container_name: wf-cart-sentinel-1
    profiles: [wildfly]
    command: >
      sh -c "sleep 15 &&
         echo 'sentinel monitor mymaster 172.18.0.2 6379 2' > /sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /sentinel.conf &&
         redis-sentinel /sentinel.conf"
    depends_on: [wf-cart-db-master]
    networks: [showdown-net]
    ports:
      - "26379:26379"

  wf-cart-sentinel-2:
    image: redis:7-alpine
    container_name: wf-cart-sentinel-2
    profiles: [wildfly]
    command: >
        sh -c "sleep 15 &&
         echo 'sentinel monitor mymaster 172.18.0.2 6379 2' > /sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /sentinel.conf &&
         redis-sentinel /sentinel.conf"
    depends_on: [wf-cart-db-master]
    networks: [showdown-net]
    ports:
      - "26380:26379"

  wf-cart-sentinel-3:
    image: redis:7-alpine
    container_name: wf-cart-sentinel-3
    profiles: [wildfly]
    command: >
        sh -c "sleep 15 &&
         echo 'sentinel monitor mymaster 172.18.0.2 6379 2' > /sentinel.conf &&
         echo 'sentinel down-after-milliseconds mymaster 5000' >> /sentinel.conf &&
         echo 'sentinel failover-timeout mymaster 10000' >> /sentinel.conf &&
         echo 'sentinel parallel-syncs mymaster 1' >> /sentinel.conf &&
         redis-sentinel /sentinel.conf"
    depends_on: [wf-cart-db-master]
    networks: [showdown-net]
    ports:
      - "26381:26379"

  wf-cart-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: cart-service/Dockerfile
    container_name: wf-cart-service
    profiles: [wildfly]
    environment:
      REDIS_SENTINEL_HOSTS: wf-cart-sentinel-1:26379,wf-cart-sentinel-2:26379,wf-cart-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
    ports:
      - "9086:8080"
    depends_on: [wf-cart-sentinel-1, wf-cart-sentinel-2, wf-cart-sentinel-3]
    networks: [showdown-net]

  # ── WildFly Services ──────────────────────────────────────────
  wf-user-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: user-service/Dockerfile
    container_name: wf-user-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-user-db:5432/userdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9081:8080"
    depends_on: [wf-user-db]
    networks: [showdown-net]

  wf-catalog-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: catalog-service/Dockerfile
    container_name: wf-catalog-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-catalog-db:5432/catalogdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9082:8080"
    depends_on: [wf-catalog-db]
    networks: [showdown-net]

  wf-inventory-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: inventory-service/Dockerfile
    container_name: wf-inventory-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-inventory-db:5432/inventorydb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9083:8080"
    depends_on: [wf-inventory-db]
    networks: [showdown-net]

  wf-order-capture-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: order-capture-service/Dockerfile
    container_name: wf-order-capture-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-order-capture-db:5432/ordercapturedb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9084:8080"
    depends_on: [wf-order-capture-db]
    networks: [showdown-net]

  wf-order-fulfillment-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: order-fulfillment-service/Dockerfile
    container_name: wf-order-fulfillment-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-order-fulfillment-db:5432/orderfulfillmentdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "9085:8080"
    depends_on: [wf-order-fulfillment-db]
    networks: [showdown-net]




