version: "3.9"

# Profiles:  spring | wildfly | observability

networks:
  showdown-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Observability ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    profiles: [observability, spring, wildfly]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [showdown-net]

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    profiles: [observability, spring, wildfly]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [showdown-net]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    profiles: [observability, spring, wildfly]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks: [showdown-net]

  # ── Spring Boot Databases ──────────────────────────────────────
  sb-user-db:
    image: postgres:16-alpine
    container_name: sb-user-db
    profiles: [spring]
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5431:5432"
    networks: [showdown-net]

  sb-catalog-db:
    image: postgres:16-alpine
    container_name: sb-catalog-db
    profiles: [spring]
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5432:5432"
    networks: [showdown-net]

  sb-inventory-db:
    image: postgres:16-alpine
    container_name: sb-inventory-db
    profiles: [spring]
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5433:5432"
    networks: [showdown-net]

  sb-order-capture-db:
    image: postgres:16-alpine
    container_name: sb-order-capture-db
    profiles: [spring]
    environment:
      POSTGRES_DB: ordercapturedb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5434:5432"
    networks: [showdown-net]

  sb-order-fulfilment-db:
    image: postgres:16-alpine
    container_name: sb-order-fulfilment-db
    profiles: [spring]
    environment:
      POSTGRES_DB: orderfulfilmentdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5435:5432"
    networks: [showdown-net]

  sb-cart-db:
    image: redis:7-alpine
    container_name: sb-cart-db
    profiles: [spring]
    ports:
      - "6379:6379"
    networks: [showdown-net]

  # ── Spring Boot Services ───────────────────────────────────────
  sb-api-gateway:
    build:
      context: ./spring-boot
      dockerfile: ./api-gateway/Dockerfile
    container_name: sb-api-gateway
    profiles: [spring]
    environment:
      GATEWAY_USER_SERVICE: http://sb-user-service:8081
      GATEWAY_CATALOG_SERVICE: http://sb-catalog-service:8082
      GATEWAY_INVENTORY_SERVICE: http://sb-inventory-service:8083
      GATEWAY_ORDER_CAPTURE_SERVICE: http://sb-order-capture-service:8084
      GATEWAY_ORDER_FULFILMENT_SERVICE: http://sb-order-fulfilment-service:8085
      GATEWAY_CART_SERVICE: http://sb-cart-service:8086
    ports:
      - "8080:8080"
    networks: [showdown-net]

  sb-user-service:
    build:
      context: ./spring-boot
      dockerfile: ./user-service/Dockerfile
    container_name: sb-user-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: showdown
      SPRING_DATASOURCE_PASSWORD: showdown123
    ports:
      - "8081:8081"
    depends_on: [sb-user-db]
    networks: [showdown-net]

  sb-catalog-service:
    build:
      context: ./spring-boot
      dockerfile: ./catalog-service/Dockerfile
    container_name: sb-catalog-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-catalog-db:5432/catalogdb
      SPRING_DATASOURCE_USERNAME: showdown
      SPRING_DATASOURCE_PASSWORD: showdown123
    ports:
      - "8082:8082"
    depends_on: [sb-catalog-db]
    networks: [showdown-net]

  sb-inventory-service:
    build:
      context: ./spring-boot
      dockerfile: ./inventory-service/Dockerfile
    container_name: sb-inventory-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-inventory-db:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: showdown
      SPRING_DATASOURCE_PASSWORD: showdown123
    ports:
      - "8083:8083"
    depends_on: [sb-inventory-db]
    networks: [showdown-net]

  sb-order-capture-service:
    build:
      context: ./spring-boot
      dockerfile: ./order-capture-service/Dockerfile
    container_name: sb-order-capture-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-order-capture-db:5432/ordercapturedb
      SPRING_DATASOURCE_USERNAME: showdown
      SPRING_DATASOURCE_PASSWORD: showdown123
    ports:
      - "8084:8084"
    depends_on: [sb-order-capture-db]
    networks: [showdown-net]

  sb-order-fulfilment-service:
    build:
      context: ./spring-boot
      dockerfile: ./order-fulfilment-service/Dockerfile
    container_name: sb-order-fulfilment-service
    profiles: [spring]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sb-order-fulfilment-db:5432/orderfulfilmentdb
      SPRING_DATASOURCE_USERNAME: showdown
      SPRING_DATASOURCE_PASSWORD: showdown123
    ports:
      - "8085:8085"
    depends_on: [sb-order-fulfilment-db]
    networks: [showdown-net]

  sb-cart-service:
    build:
      context: ./spring-boot
      dockerfile: ./cart-service/Dockerfile
    container_name: sb-cart-service
    profiles: [spring]
    environment:
      SPRING_DATA_REDIS_HOST: sb-cart-db
    ports:
      - "8086:8086"
    depends_on: [sb-cart-db]
    networks: [showdown-net]

  # ── WildFly Databases ─────────────────────────────────────────
  wf-user-db:
    image: postgres:16-alpine
    container_name: wf-user-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5441:5432"
    networks: [showdown-net]

  wf-catalog-db:
    image: postgres:16-alpine
    container_name: wf-catalog-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5442:5432"
    networks: [showdown-net]

  wf-inventory-db:
    image: postgres:16-alpine
    container_name: wf-inventory-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5443:5432"
    networks: [showdown-net]

  wf-order-capture-db:
    image: postgres:16-alpine
    container_name: wf-order-capture-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: ordercapturedb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5444:5432"
    networks: [showdown-net]

  wf-order-fulfilment-db:
    image: postgres:16-alpine
    container_name: wf-order-fulfilment-db
    profiles: [wildfly]
    environment:
      POSTGRES_DB: orderfulfilmentdb
      POSTGRES_USER: showdown
      POSTGRES_PASSWORD: showdown123
    ports:
      - "5445:5432"
    networks: [showdown-net]

  wf-cart-db:
    image: redis:7-alpine
    container_name: wf-cart-db
    profiles: [wildfly]
    ports:
      - "6380:6379"
    networks: [showdown-net]

  # ── WildFly Services ──────────────────────────────────────────
  wf-api-gateway:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./api-gateway/Dockerfile
    container_name: wf-api-gateway
    profiles: [wildfly]
    environment:
      GATEWAY_USER_SERVICE: http://wf-user-service:8080
      GATEWAY_CATALOG_SERVICE: http://wf-catalog-service:8080
      GATEWAY_INVENTORY_SERVICE: http://wf-inventory-service:8080
      GATEWAY_ORDER_CAPTURE_SERVICE: http://wf-order-capture-service:8080
      GATEWAY_ORDER_FULFILMENT_SERVICE: http://wf-order-fulfilment-service:8080
      GATEWAY_CART_SERVICE: http://wf-cart-service:8080
    ports:
      - "9080:8080"
    networks: [showdown-net]

  wf-user-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./user-service/Dockerfile
    container_name: wf-user-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-user-db:5432/userdb
      DB_USER: showdown
      DB_PASSWORD: showdown123
    ports:
      - "9081:8080"
    depends_on: [wf-user-db]
    networks: [showdown-net]

  wf-catalog-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./catalog-service/Dockerfile
    container_name: wf-catalog-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-catalog-db:5432/catalogdb
      DB_USER: showdown
      DB_PASSWORD: showdown123
    ports:
      - "9082:8080"
    depends_on: [wf-catalog-db]
    networks: [showdown-net]

  wf-inventory-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./inventory-service/Dockerfile
    container_name: wf-inventory-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-inventory-db:5432/inventorydb
      DB_USER: showdown
      DB_PASSWORD: showdown123
    ports:
      - "9083:8080"
    depends_on: [wf-inventory-db]
    networks: [showdown-net]

  wf-order-capture-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./order-capture-service/Dockerfile
    container_name: wf-order-capture-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-order-capture-db:5432/ordercapturedb
      DB_USER: showdown
      DB_PASSWORD: showdown123
    ports:
      - "9084:8080"
    depends_on: [wf-order-capture-db]
    networks: [showdown-net]

  wf-order-fulfilment-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./order-fulfilment-service/Dockerfile
    container_name: wf-order-fulfilment-service
    profiles: [wildfly]
    environment:
      DB_URL: jdbc:postgresql://wf-order-fulfilment-db:5432/orderfulfilmentdb
      DB_USER: showdown
      DB_PASSWORD: showdown123
    ports:
      - "9085:8080"
    depends_on: [wf-order-fulfilment-db]
    networks: [showdown-net]

  wf-cart-service:
    build:
      context: ./wildfly-microprofile
      dockerfile: ./cart-service/Dockerfile
    container_name: wf-cart-service
    profiles: [wildfly]
    environment:
      REDIS_HOST: wf-cart-db
    ports:
      - "9086:8080"
    depends_on: [wf-cart-db]
    networks: [showdown-net]

