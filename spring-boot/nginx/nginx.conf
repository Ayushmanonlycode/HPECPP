worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream definitions — one per Spring Boot microservice ──
    upstream user_service {
        server sb-user-service:8081;
    }
    upstream catalog_service {
        server sb-catalog-service:8082;
    }
    upstream inventory_service {
        server sb-inventory-service:8083;
    }
    upstream order_capture_service {
        server sb-order-capture-service:8084;
    }
    upstream order_fulfilment_service {
        server sb-order-fulfilment-service:8085;
    }
    upstream cart_service {
        server sb-cart-service:8086;
    }

    server {
        listen 8080;
        server_name _;

        # ── Global proxy settings ──────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the JWT token to all downstream services
        proxy_set_header Authorization     $http_authorization;

        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, x-user-id' always;

        # Handle pre-flight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Routing ────────────────────────────────────────────

        location /api/users {
            proxy_pass http://user_service;
        }

        location /api/categories {
            proxy_pass http://catalog_service;
        }

        location /api/products {
            proxy_pass http://catalog_service;
        }

        location /api/items {
            proxy_pass http://catalog_service;
        }

        location /api/inventory {
            proxy_pass http://inventory_service;
        }

        location /api/orders {
            proxy_pass http://order_capture_service;
        }

        location /api/fulfilments {
            proxy_pass http://order_fulfilment_service;
        }

        location /api/cart {
            proxy_pass http://cart_service;
        }

        # ── Health check endpoint (served by NGINX itself) ─────
        location /health {
            access_log off;
            return 200 'nginx-gateway healthy\n';
            add_header Content-Type text/plain;
        }
    }
}
