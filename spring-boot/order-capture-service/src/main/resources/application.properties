server.port=8084
spring.application.name=order-capture-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ordercapturedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:showdown}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Keycloak JWT validation (issuer-uri tells Spring where to fetch the public verification keys)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/jpetstore
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak:8080}/realms/jpetstore/protocol/openid-connect/certs

# OAuth2 Client Configuration for inter-service communication
spring.security.oauth2.client.registration.keycloak.client-id=jpetstore-gateway
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_URL:http://localhost:8180}/realms/jpetstore/protocol/openid-connect/token

# Inventory Service URL (overridden via SERVICES_INVENTORY_URL env var in Docker)
services.inventory.url=${SERVICES_INVENTORY_URL:http://localhost:8083}

# Fulfilment Service URL
services.fulfilment.url=${SERVICES_FULFILMENT_URL:http://localhost:8085}

# User Service URL
services.user.url=${SERVICES_USER_URL:http://localhost:8081}

# Resilience4j — Circuit Breaker for inventory-service calls
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventory-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory-service.register-health-indicator=true

# Resilience4j — Retry for inventory-service calls
resilience4j.retry.instances.inventory-service.max-attempts=3
resilience4j.retry.instances.inventory-service.wait-duration=500ms
resilience4j.retry.instances.inventory-service.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# Resilience4j — Circuit Breaker for fulfilment-service calls
resilience4j.circuitbreaker.instances.fulfilment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.fulfilment-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fulfilment-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fulfilment-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.fulfilment-service.register-health-indicator=true

# Resilience4j — Retry for fulfilment-service calls
resilience4j.retry.instances.fulfilment-service.max-attempts=3
resilience4j.retry.instances.fulfilment-service.wait-duration=500ms
resilience4j.retry.instances.fulfilment-service.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
