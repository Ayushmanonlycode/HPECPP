server.port=8080
spring.application.name=api-gateway
management.endpoints.web.exposure.include=health,info

# Downstream service URLs (override via env vars for Docker)
gateway.services.user-service=${GATEWAY_USER_SERVICE:http://localhost:8081}
gateway.services.catalog-service=${GATEWAY_CATALOG_SERVICE:http://localhost:8082}
gateway.services.inventory-service=${GATEWAY_INVENTORY_SERVICE:http://localhost:8083}
gateway.services.order-capture-service=${GATEWAY_ORDER_CAPTURE_SERVICE:http://localhost:8084}
gateway.services.order-fulfilment-service=${GATEWAY_ORDER_FULFILMENT_SERVICE:http://localhost:8085}
gateway.services.cart-service=${GATEWAY_CART_SERVICE:http://localhost:8086}
