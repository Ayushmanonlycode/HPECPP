server.port=8082
spring.application.name=catalog-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:showdown}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Keycloak JWT validation (issuer-uri tells Spring where to fetch the public verification keys)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/jpetstore
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak:8080}/realms/jpetstore/protocol/openid-connect/certs

# OAuth2 Client Configuration for inter-service communication
spring.security.oauth2.client.registration.keycloak.client-id=jpetstore-gateway
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_URL:http://localhost:8180}/realms/jpetstore/protocol/openid-connect/token

# Inventory Service URL (overridden via SERVICES_INVENTORY_URL env var in Docker)
services.inventory.url=${SERVICES_INVENTORY_URL:http://localhost:8083}

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
