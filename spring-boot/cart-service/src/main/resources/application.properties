server.port=8086
spring.application.name=cart-service
# Standalone Redis Configuration (Disabled in favor of Sentinel)
# spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
# spring.data.redis.port=6379
spring.data.redis.timeout=5000ms

# Redis Sentinel Configuration
spring.data.redis.sentinel.master=${SPRING_DATA_REDIS_SENTINEL_MASTER:mymaster}
spring.data.redis.sentinel.nodes=${SPRING_DATA_REDIS_SENTINEL_NODES:localhost:26379}
cart.ttl.hours=24
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Keycloak JWT validation (using jwk-set-uri directly prevents container boot-time issuer connection failures)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/jpetstore
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak:8080}/realms/jpetstore/protocol/openid-connect/certs

# SpringDoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
