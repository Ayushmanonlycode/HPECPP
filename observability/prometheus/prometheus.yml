global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot domain services — /actuator/prometheus (Micrometer JVM + HTTP metrics)
  # Note: sb-api-gateway is now NGINX and does not expose /actuator/prometheus
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'sb-user-service:8081'
          - 'sb-catalog-service:8082'
          - 'sb-inventory-service:8083'
          - 'sb-order-capture-service:8084'
          - 'sb-order-fulfilment-service:8085'
          - 'sb-cart-service:8086'

  # WildFly services — /metrics (MP Metrics)
  - job_name: 'wildfly-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'wf-api-gateway:8080'
          - 'wf-user-service:8080'
          - 'wf-catalog-service:8080'
          - 'wf-inventory-service:8080'
          - 'wf-order-capture-service:8080'
          - 'wf-order-fulfilment-service:8080'
          - 'wf-cart-service:8080'

  # OTel Collector — exposes metrics received via OTLP from both stacks
  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'otel-collector:8889'

  # cAdvisor — container-level CPU, memory, and network metrics
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'cadvisor:8080'
